# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - CanvasSync

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build CanvasSync/CanvasSync.csproj --configuration Release

       - name: Create EF Migration Bundle
         run: |
           dotnet tool install --global dotnet-ef
           dotnet ef migrations bundle --self-contained --force --project CanvasSync/CanvasSync.csproj -o "${{env.DOTNET_ROOT}}/myapp/efbundle.exe"

      - name: dotnet publish
        run: dotnet publish CanvasSync/CanvasSync.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Hash published application
        shell: pwsh
        run: |
          Get-FileHash "${{env.DOTNET_ROOT}}/myapp/CanvasSync.dll" -Algorithm SHA256

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Verify downloaded artifact
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nDownloaded files:"
          Get-ChildItem -Recurse -File | Select-Object FullName, Length, LastWriteTime

          Write-Host "`nCanvasSync.dll:"
          Get-ChildItem -Recurse -File -Filter "CanvasSync.dll" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Get-FileHash $_.FullName -Algorithm SHA256
          }
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7AE80EB7CBCC4A7F8547AE755CCBC3DA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A530B4FB7804FA69A9427C39C1EBD62 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF131621FFB9400D8021F354FFD166CE }}

      - name: Run Database Migrations
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7AE80EB7CBCC4A7F8547AE755CCBC3DA }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A530B4FB7804FA69A9427C39C1EBD62 }}
        run: |
          ./efbundle.exe --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CanvasSync'
          slot-name: 'Production'
          package: .
          